<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a10"><meta name="description" content="Gitarist ile gitar öğren. Ritmini bul, kendi hızında ilerle.">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css?v=31">
  <title>Gitarist — Gitar öğren</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Gitarist ana sayfa"><span class="brand-mark">G<span>♫</span></span><span>GİTARİST<small>GİTAR ÖĞREN</small></span></a>
      <div class="side-label">MENÜ</div>
      <nav class="side-nav" aria-label="Ana menü">
        <button data-route="home" class="nav-item"><span>⌂</span>Ana Sayfa</button><button data-route="practice" class="nav-item active"><span>♫</span>Tab Çalış</button><button data-route="editor" class="nav-item"><span>✎</span>TAB Düzenle</button><button data-route="learn" class="nav-item"><span>◈</span>Tab Öğren</button><button data-route="progress" class="nav-item"><span>▥</span>İlerlemen</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="daily-card"><div class="daily-top"><span>BUGÜNÜN HEDEFİ</span><span>✦</span></div><strong>10 <small>dk</small></strong><div class="progress-track"><i id="daily-progress"></i></div><p id="daily-copy">Günün çalışmasına başla</p></div>
      <div class="profile"><div class="avatar">♪</div><div><b>Gitar yolculuğun</b><small id="profile-xp">0 XP · Seviye 1</small></div><span class="profile-dot"></span></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-brand" data-route="home">GİTARİST<span>♫</span></button><div class="breadcrumb"><span>ÇALIŞMA ALANI</span><b id="page-title">Tab Çalış</b></div><div class="top-actions"><button class="icon-button" id="install-button" hidden aria-label="Uygulamayı yükle">↓</button><button class="streak-pill"><span>✦</span> <b id="streak-top">0</b> gün seri</button><div class="avatar small-avatar">♪</div></div></header>
      <div id="view" class="view"></div>
      <div class="portrait-rotate-prompt"><span aria-hidden="true">↻</span><strong>Telefonu yatay çevirin</strong><p>Tab çalışması yatay ekranda açılır.</p><button class="primary-button" data-route="editor">＋ TAB oluştur</button></div>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="Alt menü"><button data-route="home"><span>⌂</span>Ana Sayfa</button><button data-route="practice" class="active"><span>♫</span>TAB</button><button data-route="learn"><span>◈</span>TAB Öğren</button><button data-route="progress"><span>▥</span>İlerleme</button></nav>
  <div class="toast" id="toast" role="status"></div>
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      window.deferredInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => { window.deferredInstallPrompt = null; });
  </script>
  <script type="module">
    try {
      const { startClassroom } = await import('./app/classroom.js?v=7');
      const classroomReady = await startClassroom();
      if (classroomReady !== true) await import('./app/main.js?v=64');
    } catch (error) {
      console.error('Gitarist açılış hatası:', error);
      const gate = document.querySelector('#classroom-gate');
      if (gate) {
        gate.hidden = false;
        document.body.classList.add('classroom-auth-active');
        gate.querySelector('[data-classroom-content]').innerHTML = '<h1>Uygulama açılamadı</h1><p>Bağlantıyı ve uygulama önbelleğini kontrol edip yeniden deneyin.</p><button type="button" class="primary-button" data-classroom-action="reload-app">Yeniden yükle</button>';
        const status = gate.querySelector('[data-classroom-status]');
        if (status) status.textContent = 'Açılış hatası kaydedildi. Yeniden yükle düğmesine dokun.';
      } else {
        document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-content:center;gap:12px;padding:24px;background:#090a10;color:#f4f4f8;font:16px system-ui;text-align:center"><h1>Uygulama açılamadı</h1><p>Bağlantıyı kontrol edip yeniden deneyin.</p><button onclick="location.reload()" style="padding:12px;border:0;border-radius:10px;background:#8060ed;color:white">Yeniden yükle</button></main>';
      }
    }
  </script>
</body>
</html>
